name: NexusFeed Curator

on:
  workflow_dispatch:
  schedule:
    # Mon off (keep Level 1 base from other repos). No weekend runs.
    - cron: "0 10,14,18 * * 2"          # Tue: 3 slots (Level 2)
    - cron: "0 8,10,12,14,16,18 * * 3"   # Wed: 6 slots (Level 3)
    - cron: "0 7,9,11,13,15,17,19,21 * * 4"  # Thu: 8 slots (Level 4)
    - cron: "0 10,14,18 * * 5"          # Fri: 3 slots (Level 2)

permissions:
  contents: write

concurrency:
  group: nexusfeed_state
  cancel-in-progress: false

jobs:
  run_bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news curator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit state files
        run: |
          git config user.name "MOHAbdelkarim"
          git config user.email "mohaabdelkarim2@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add daily_state.json posted_articles.json posted_now.json README.md
          git diff --staged --quiet || git commit -m "chore(state): update bot state [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack digest on success
        if: success()
        env:
          SLACK_WEBHOOK_AI_PIPELINES: ${{ secrets.SLACK_WEBHOOK_AI_PIPELINES }}
        run: |
          if [ -z "$SLACK_WEBHOOK_AI_PIPELINES" ]; then exit 0; fi
          TITLE=$(python -c "import json; d=json.load(open('posted_now.json',encoding='utf-8')); item=d[0] if isinstance(d,list) and d else {}; print(item.get('title','NexusFeed run')[:120])" 2>/dev/null || echo "NexusFeed run")
          URL=$(python -c "import json; d=json.load(open('posted_now.json',encoding='utf-8')); item=d[0] if isinstance(d,list) and d else {}; print(item.get('url',''))" 2>/dev/null || echo "")
          python slack_notify.py --digest \
            --title "NexusFeed" \
            --text "*${TITLE}*\n${URL}" \
            --webhook-env SLACK_WEBHOOK_AI_PIPELINES

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            text: "CI failed: ${{ github.repository }} / ${{ github.workflow }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.repository }}* — `${{ github.workflow }}` failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
