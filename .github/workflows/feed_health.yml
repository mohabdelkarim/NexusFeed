name: NexusFeed Feed Health

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  check_feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests feedparser python-dateutil
      - name: Run feed health check
        run: python check_feeds.py
      - name: Fail if feeds below threshold
        run: |
          python -c "
          import json, sys
          with open('feed_health.json', encoding='utf-8') as f:
              results = json.load(f)
          working = results['working_count']
          stale = len(results.get('stale_feeds', []))
          dead = len(results.get('dead_feeds', []))
          total = results['total_count']
          usable = working + stale
          print(f'Working feeds: {working}/{total} (usable with stale: {usable}, dead: {dead})')
          # Fail only on catastrophic outage. Stale feeds still parse and serve content.
          # Occasional WAF blocks on 1-3 sources should not red the workflow.
          if dead > 3:
              print('ERROR: Too many dead feeds!')
              sys.exit(1)
          "

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERTS }}
          webhook-type: incoming-webhook
          payload: |
            text: "CI failed: ${{ github.repository }} / ${{ github.workflow }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*${{ github.repository }}* — `${{ github.workflow }}` failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
